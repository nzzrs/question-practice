name: question_practice
description: "Offline-first question practice with error cards and Anki export."
publish_to: 'none'
version: 0.9.5+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  collection: ^1.19.1
  crypto: ^3.0.7
  drift: ^2.35.3
  file_picker: ^13.3.0
  flutter_custom_tabs: ^2.6.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  json_schema: ^5.2.2
  material_3_expressive: ^1.2.0
  material_ui: ^1.8.0
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.4.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/schema/
    - assets/samples/
